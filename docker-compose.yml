#   docker compose up -d --build
#
# One browser, one agent at a time. The port is published on 127.0.0.1 only: put a TLS reverse
# proxy in front of it and set AUTH_TOKEN / AUTH_TOKENS before letting other machines in.

name: browser-use-mcp

services:
  browser-mcp:
    build:
      context: .
      target: runtime
      args:
        # Only if the build cannot reach PyPI / Debian directly (see BUILD_PROXY in .env.example).
        HTTP_PROXY: ${BUILD_PROXY:-}
        HTTPS_PROXY: ${BUILD_PROXY:-}
    image: browser-use-mcp:3.0.0
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Container-side networking is fixed; change the published port via PORT below.
      TRANSPORT: http
      HOST: 0.0.0.0
      PORT: "8000"
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    shm_size: "1gb"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 40s      # the browser gets up to 2 x 20s to finish its call and close
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
